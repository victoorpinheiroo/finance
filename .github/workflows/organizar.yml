name: Organizar pastas do projeto
on:
  push:
    paths:
      - ".github/workflows/organizar.yml"
permissions:
  contents: write
jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mover arquivos para as pastas
        run: |
          set -e
          mkdir -p css js img/fotos audio video lib/bootstrap/css lib/bootstrap/js lib/fonts doc
          git mv base.css bootstrap-tema.css paginas.css puro.css css/
          git mv aprenda.js artigo.js artigos.js comum.js contato.js dados.js favoritos.js inicio.js menu.js metas.js movimentacoes.js multimidia.js simuladores.js sobre.js tema.js js/
          git mv calculadora.jpg cartoes.jpg cem-reais.jpg consumo.jpg dividas.jpg investimentos.jpg metas.jpg orcamento.jpg planejamento.jpg poupanca.jpg preocupacao.jpg reais.jpg seguranca.jpg img/fotos/
          git mv radioagencia-educacao-e-endividamento.mp3 radioagencia-equilibrio-das-contas.mp3 audio/
          git mv finance-apresentacao.mp4 finance-apresentacao-poster.jpg video/
          git mv bootstrap.min.css lib/bootstrap/css/
          git mv bootstrap.bundle.min.js lib/bootstrap/js/
          git mv LICENSE-inter.txt LICENSE-manrope.txt inter-latin.woff2 inter-latin-ext.woff2 manrope-latin.woff2 manrope-latin-ext.woff2 lib/fonts/
          git mv FINANCE-Documentacao.docx doc/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Organiza os arquivos nas pastas do projeto"
          git push
